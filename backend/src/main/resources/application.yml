spring:
  application:
    name: interactive-edu-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

logging:
  level:
    root: INFO
    com.interactive.edu: DEBUG

storage:
  type: local
  local-base-dir: ./data/courseware

python:
  client:
    base-url: http://localhost:8001
    parse-path: /python/v1/parse
    connect-timeout: 5s
    read-timeout: 30s

# -----------------------------------------------------------------------
# TTS 文本转语音配置（阿里云 NLS 语音合成）
# 敏感字段请覆盖于 application-dev.yml / 环境变量，不要提交明文 Key
# -----------------------------------------------------------------------
tts:
  provider: ALIYUN
  aliyun:
    app-key: ${TTS_ALIYUN_APP_KEY:your-app-key}
    access-key-id: ${TTS_ALIYUN_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${TTS_ALIYUN_ACCESS_KEY_SECRET:your-access-key-secret}
    endpoint: https://nls-gateway.cn-shanghai.aliyuncs.com
    voice: aixia
    sample-rate: 16000
    format: wav
    speech-rate: 0
    pitch-rate: 0
    volume: 50
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
