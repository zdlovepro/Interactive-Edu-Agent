spring:
  application:
    name: interactive-edu-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

logging:
  level:
    root: INFO
    com.interactive.edu: DEBUG

chain:
  strict: ${STRICT_CHAIN:false}

python:
  client:
    parse-path: /python/v1/parse
    script-generate-path: /python/v1/script/generate
    qa-path: /python/v1/qa/ask-text
    course-resource-import-path: /python/v1/course-resource-import/import
    chaoxing-auth-path: /python/v1/chaoxing/auth/sessions
    video-render-path: /python/v1/video-render/render
    connect-timeout: ${PYTHON_CLIENT_CONNECT_TIMEOUT:5s}
    read-timeout: ${PYTHON_CLIENT_READ_TIMEOUT:30s}

video:
  render:
    base-dir: ${RENDER_BASE_DIR:./data/render}
    backend-base-url: ${VIDEO_RENDER_BACKEND_BASE_URL:http://localhost:8080}
