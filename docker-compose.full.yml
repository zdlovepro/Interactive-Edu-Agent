services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: ied-full-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-interactive_edu}
      MYSQL_USER: ${MYSQL_USERNAME:-interactive_edu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql-password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ied-full-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2023-03-20T20-16-18Z}
    container_name: ied-full-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-interactive-edu-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10

  etcd:
    image: ${ETCD_IMAGE:-milvusdb/etcd:3.5.5-r2}
    container_name: ied-full-etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_DATA_DIR: /bitnami/etcd/data
    volumes:
      - etcd_data:/bitnami/etcd

  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.4.0}
    container_name: ied-full-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-interactive-edu-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-minio-password}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10

  python-service:
    build:
      context: .
      dockerfile: python-service/Dockerfile
    container_name: ied-full-python
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-AI Interactive Lecture API}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      MILVUS_URI: http://milvus:19530
      MILVUS_USER: ${MILVUS_USER:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}
      COLLECTION_NAME: ${COLLECTION_NAME:-lecture_knowledge}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-v4}
      EMBEDDING_DIM_SIZE: ${EMBEDDING_DIM_SIZE:-1024}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DIGITAL_HUMAN_ENABLED: ${DIGITAL_HUMAN_ENABLED:-false}
      DIGITAL_HUMAN_API_KEY: ${DIGITAL_HUMAN_API_KEY:-}
      DIGITAL_HUMAN_MODEL_NAME: ${DIGITAL_HUMAN_MODEL_NAME:-wan2.7-r2v}
      DIGITAL_HUMAN_REF_IMAGE_PATH: ${DIGITAL_HUMAN_REF_IMAGE_PATH:-}
      DIGITAL_HUMAN_MAX_SEGMENTS: ${DIGITAL_HUMAN_MAX_SEGMENTS:-1}
      DIGITAL_HUMAN_MAX_SEGMENT_RATIO: ${DIGITAL_HUMAN_MAX_SEGMENT_RATIO:-0.25}
      DIGITAL_HUMAN_MIN_PAGE_GAP: ${DIGITAL_HUMAN_MIN_PAGE_GAP:-2}
      DIGITAL_HUMAN_MIN_IMPORTANCE_SCORE: ${DIGITAL_HUMAN_MIN_IMPORTANCE_SCORE:-0.55}
      DIGITAL_HUMAN_MIN_AUDIO_SECONDS: ${DIGITAL_HUMAN_MIN_AUDIO_SECONDS:-2}
      DIGITAL_HUMAN_MAX_AUDIO_SECONDS: ${DIGITAL_HUMAN_MAX_AUDIO_SECONDS:-10}
      DIGITAL_HUMAN_LEAD_TRIM_SECONDS: ${DIGITAL_HUMAN_LEAD_TRIM_SECONDS:-1.5}
      DIGITAL_HUMAN_OVERLAY_WIDTH_RATIO: ${DIGITAL_HUMAN_OVERLAY_WIDTH_RATIO:-0.22}
      DIGITAL_HUMAN_OVERLAY_MARGIN_TOP: ${DIGITAL_HUMAN_OVERLAY_MARGIN_TOP:-0}
      DIGITAL_HUMAN_OVERLAY_MARGIN_RIGHT: ${DIGITAL_HUMAN_OVERLAY_MARGIN_RIGHT:-0}
      DIGITAL_HUMAN_POLL_INTERVAL_SECONDS: ${DIGITAL_HUMAN_POLL_INTERVAL_SECONDS:-5}
      DIGITAL_HUMAN_TASK_TIMEOUT_SECONDS: ${DIGITAL_HUMAN_TASK_TIMEOUT_SECONDS:-1800}
      DIGITAL_HUMAN_VIDEO_EXTENSION: ${DIGITAL_HUMAN_VIDEO_EXTENSION:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v4-pro}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      STRICT_CHAIN: ${STRICT_CHAIN:-false}
      RENDER_BASE_DIR: /app/data/render
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      CHAOXING_AUTH_HEADLESS: ${CHAOXING_AUTH_HEADLESS:-true}
      CHAOXING_AUTH_TTL_SECONDS: ${CHAOXING_AUTH_TTL_SECONDS:-7200}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-interactive-edu-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-courseware}
      MINIO_SECURE: "false"
    volumes:
      - course_import_data:/app/data/course-resource-import
      - render_data:/app/data/render
      - ./:/workspace:ro
    ports:
      - "${PYTHON_SERVICE_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/python/v1/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ied-full-backend
    environment:
      SPRING_PROFILES_ACTIVE: full
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-interactive_edu}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-interactive_edu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ""
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-interactive-edu-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-courseware}
      MINIO_SECURE: "false"
      PYTHON_CLIENT_BASE_URL: http://python-service:8001
      PYTHON_CLIENT_READ_TIMEOUT: ${PYTHON_CLIENT_READ_TIMEOUT:-120s}
      STRICT_CHAIN: ${STRICT_CHAIN:-false}
      RENDER_BASE_DIR: /app/data/render
      VIDEO_RENDER_BACKEND_BASE_URL: http://backend:8080
      TTS_ENABLED: ${TTS_ENABLED:-false}
      ASR_ENABLED: ${ASR_ENABLED:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TTS_DASHSCOPE_API_KEY: ${TTS_DASHSCOPE_API_KEY:-}
      ASR_QWEN_API_KEY: ${ASR_QWEN_API_KEY:-}
    volumes:
      - backend_data:/app/data
      - course_import_data:/app/data/course-resource-import
      - render_data:/app/data/render
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      python-service:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_TITLE: Interactive-Edu-Agent
        VITE_ENABLE_MOCK: "false"
    container_name: ied-full-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  backend_data:
  course_import_data:
  render_data:
